# The single check registry: `just check` and CI both run exactly this.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: mixed-line-ending
        args: ['--fix=auto']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: secret and PII scanning with gitleaks (.gitleaks.toml)
        args: ['--config', '.gitleaks.toml']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        files: ^scripts/
      - id: ruff-format
        files: ^scripts/

  - repo: local
    hooks:
      # Both validators run their own self-test first on every invocation, so
      # the checks are proven to fire even while the published catalogs are
      # empty.
      - id: validate-repo
        name: validate repository structure and the marker contract
        entry: uv run --quiet scripts/validate_repo.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-skills
        name: check every skill's structure, SKILL.md, and links
        entry: uv run --quiet scripts/check_skill.py --all
        language: system
        pass_filenames: false
        always_run: true
