# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: mixed-line-ending
        args: [ "--fix=auto" ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: secret scanning with detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: secret and PII scanning with gitleaks (.gitleaks.toml)
        args: ['--config', '.gitleaks.toml']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        files: ^scripts/
      - id: ruff-format
        files: ^scripts/

  - repo: local
    hooks:
      - id: validate-repo
        name: validate repository structure
        entry: uv run --quiet scripts/validate_repo.py
        language: system
        pass_filenames: false
        always_run: true

      # Self-activating: with no skills yet this never runs, so it costs nothing
      # and reports no misleading pass. It fires on the commit that adds skill #1.
      - id: check-skill
        name: check changed skills
        entry: uv run --quiet scripts/check_skill.py --all
        language: system
        pass_filenames: false
        files: ^(skills|\.agents/skills)/.*/SKILL\.md$

      # The marker and link checks have no subject until the first skill lands.
      # Without this they are untested code that would pass silently forever.
      - id: check-skill-selftest
        name: prove the skill checks still fire
        entry: uv run --quiet scripts/check_skill.py --selftest
        language: system
        pass_filenames: false
        files: ^scripts/check_skill\.py$
