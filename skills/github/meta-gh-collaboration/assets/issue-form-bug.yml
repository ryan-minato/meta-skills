name: Bug report
description: <one line telling reporters what belongs here>
labels: ["<existing-label>"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: <what the maintainer needs in order to reproduce it>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: <OS, runtime, hardware — only what this project needs>
