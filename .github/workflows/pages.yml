name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/build_docs.py
      - scripts/validate_repo.py
      - .github/workflows/pages.yml
  # Escape hatch: first enablement, or redeploying without a docs change.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight deployment; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v8 tag, despite shipping 8.x.
      - uses: astral-sh/setup-uv@v7

      # Never deploy pages that fail E1-E3 (the validator self-tests first).
      - name: Validate the repository, including docs pages
        run: uv run --quiet scripts/validate_repo.py

      - name: Build the site and llms.txt
        run: uv run --quiet scripts/build_docs.py --out _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
