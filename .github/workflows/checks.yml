name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs the identical registry the local `just check` runs, so CI and the
  # working environment cannot drift.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no v8 tag, despite shipping 8.x.
      - uses: astral-sh/setup-uv@v7

      - name: Run the check registry
        run: uvx pre-commit run --all-files

  # Full-history scan with the same scanner and ruleset as the commit hook:
  # a secret committed and later removed is still leaked and must be found.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .
